<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>COBOL Learning Lab</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f9; }
    .tok-known { text-decoration: underline dotted #3498db; cursor: help; }
    #text-container { display: none; gap: 20px; margin-top: 20px; }
    .pane { flex: 1; border: 1px solid #ddd; padding: 15px; background: #fff; border-radius: 8px; }
    pre { white-space: pre-wrap; background: #282c34; color: #abb2bf; padding: 10px; border-radius: 4px; }
    
    #admin-panel { 
        background: #fff; border: 2px solid #3498db; padding: 15px; 
        margin-bottom: 20px; border-radius: 8px; display: none; 
    }
    .admin-row { display: flex; gap: 10px; margin-bottom: 5px; }
    .admin-row input { flex: 1; padding: 5px; }
    .controls { background: #eee; padding: 15px; border-radius: 8px; }
    button { cursor: pointer; padding: 6px 12px; }
  </style>
</head>
<body>

  <h1>COBOL Learning Lab</h1>

  <div class="controls">
    <button id="toggleAdmin">⚙ Manage Glossary</button>
    <select id="example-select">
      <option value="1">Example 0 - Intro</option>
      <option value="2">Example 1 - Basics</option>
      <option value="3">Example 2 - File I/O</option>
      <option value="4">Example 3 - SQL</option>
    </select>
    <button id="showExample">Load Files</button>
  </div>

  <div id="admin-panel">
    <h3>Glossary Editor</h3>
    <div id="keyword-admin-list"></div>
    <hr>
    <div class="admin-row">
      <input type="text" id="new-key" placeholder="New Keyword (e.g. MOVE)">
      <input type="text" id="new-val" placeholder="Definition">
      <button onclick="addKeyword()">Add</button>
    </div>
    <button style="margin-top:10px; background: #2ecc71; color: white; border: none;" onclick="saveKeywords()">Save All Changes</button>
  </div>

  <div id="text-container">
    <div class="pane">
      <h3 id="left-title"></h3>
      <pre id="left-content"></pre>
    </div>
    <div class="pane">
      <h3 id="right-title"></h3>
      <pre id="right-content"></pre>
    </div>
  </div>

  <script src="{{ url_for('static', filename='webpage.js') }}"></script>
</body>
</html>
