<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lets Learn COBOL</title>
  <style>
    .tok {
      border-radius: 2px;
      cursor: help;
    }
    .tok-known {
      text-decoration: underline dotted rgba(137, 180, 250, 0.6);
      text-underline-offset: 3px;
    }
    .tok-known:hover {
      background: rgba(137, 180, 250, 0.15);
      outline: 1px solid rgba(137, 180, 250, 0.3);
    }
    #text-container {
      display: none;
      flex-direction: row;
      gap: 1rem;
    }
    .pane {
      flex: 1;
      border: 1px solid #ccc;
      padding: 1rem;
      min-height: 200px;
      overflow-x: auto;
    }
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .pane-header h3 {
      margin: 0;
    }
    .pane pre {
      white-space: pre-wrap;
      font-family: monospace;
      margin: 0;
    }
    #example-controls {
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <h1>Let's Learn COBOL</h1>
  <div id="example-controls">
    <label for="example-select">Choose an example:</label>
    <select id="example-select">
      <option value="">-- Select --</option>
      <option value="1">Example 0 – Intro</option>
      <option value="2">Example 1 - Basics</option>
      <option value="3">Example 2 - File I/O</option>
      <option value="4">Example 3 - SQL</option>
    </select>
    <button id="showExample">Show Example</button>
    <button id="prevExample">◀ Prev</button>
    <button id="nextExample">Next ▶</button>
  </div>

  <div id="text-container">
    <div class="pane">
      <div class="pane-header">
        <h3 id="left-title"></h3>
        <button id="rotateLeft">⟳ Rotate</button>
      </div>
      <pre id="left-content"></pre>
    </div>
    <div class="pane">
      <div class="pane-header">
        <h3 id="right-title"></h3>
        <button id="rotateRight">⟳ Rotate</button>
      </div>
      <pre id="right-content"></pre>
    </div>
  </div>

  <script src="{{ url_for('static', filename='webpage.js') }}"></script>
</body>
</html>
